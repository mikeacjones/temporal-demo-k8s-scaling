# Temporal Worker Controller values for the booth demo.

image:
  # v1.13.0 added support for per-version KEDA metrics label templating,
  # required by KEDA integration in the demo.
  tag: "v1.13.0"
workerResourceTemplate:
  # Allow WorkerResourceTemplates to render KEDA ScaledObjects (per worker
  # version) in addition to plain HPAs. This also grants the controller RBAC.
  allowedResources:
    - kinds: ["HorizontalPodAutoscaler"]
      apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
    - kinds: ["ScaledObject"]
      apiGroups: ["keda.sh"]
      resources: ["scaledobjects"]
